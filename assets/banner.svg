<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Live Weather animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a8cff"><animate attributeName="stop-color" values="#1a8cff;#5f2c82;#0b1026;#5f2c82;#1a8cff" dur="16s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00f2fe"><animate attributeName="stop-color" values="#00f2fe;#49a09d;#1a2a6c;#49a09d;#00f2fe" dur="16s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="sun" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#fff6bf"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9a1f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="120" cy="50" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="90" r="1.6"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="40" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="70" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="35" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sun with rotating rays -->
    <g transform="translate(1010 120)">
      <circle r="70" fill="#ffd23f" opacity=".55" filter="url(#glow)"/>
      <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <line x1="0" y1="-62" x2="0" y2="-80"/><line x1="0" y1="62" x2="0" y2="80"/>
        <line x1="-62" y1="0" x2="-80" y2="0"/><line x1="62" y1="0" x2="80" y2="0"/>
        <line x1="44" y1="44" x2="57" y2="57"/><line x1="-44" y1="-44" x2="-57" y2="-57"/>
        <line x1="44" y1="-44" x2="57" y2="-57"/><line x1="-44" y1="44" x2="-57" y2="57"/>
      </g>
      <circle r="46" fill="url(#sun)"><animate attributeName="r" values="46;49;46" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- drifting clouds -->
    <g fill="#fff" opacity=".92">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-260 0;1300 0" dur="38s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="70" rx="70" ry="24"/><circle cx="-28" cy="56" r="26"/><circle cx="14" cy="48" r="34"/>
      </g>
      <g opacity=".75">
        <animateTransform attributeName="transform" type="translate" values="-420 0;1300 0" dur="52s" begin="-20s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="170" rx="90" ry="28"/><circle cx="-36" cy="154" r="30"/><circle cx="18" cy="144" r="40"/>
      </g>
    </g>

    <!-- falling rain -->
    <g stroke="#cfe8ff" stroke-width="2" stroke-linecap="round" opacity=".6">
      <line x1="140" y1="-20" x2="132" y2="0"><animateTransform attributeName="transform" type="translate" values="0 0;-40 360" dur="1.3s" repeatCount="indefinite"/></line>
      <line x1="300" y1="-20" x2="292" y2="0"><animateTransform attributeName="transform" type="translate" values="0 0;-40 360" dur="1.1s" begin="-.4s" repeatCount="indefinite"/></line>
      <line x1="460" y1="-20" x2="452" y2="0"><animateTransform attributeName="transform" type="translate" values="0 0;-40 360" dur="1.5s" begin="-.9s" repeatCount="indefinite"/></line>
      <line x1="620" y1="-20" x2="612" y2="0"><animateTransform attributeName="transform" type="translate" values="0 0;-40 360" dur="1.2s" begin="-.2s" repeatCount="indefinite"/></line>
      <line x1="780" y1="-20" x2="772" y2="0"><animateTransform attributeName="transform" type="translate" values="0 0;-40 360" dur="1.4s" begin="-.7s" repeatCount="indefinite"/></line>
    </g>

    <!-- title -->
    <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#fff">Live Weather
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="74" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#eaf6ff" opacity=".95">Weather that looks like the sky outside.</text>
    <text x="74" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#d6ecff" opacity=".85">Forecast  •  Air Quality  •  7 Interactive Graphs</text>
  </g>
</svg>
