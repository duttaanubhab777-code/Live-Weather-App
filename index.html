<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a8cff" id="tc">
<title>Live Weather — forecast, air quality & graphs</title>
<meta name="description" content="Live weather dashboard with hourly and 5-day forecast, air quality, wind, pressure and interactive graphs. The sky behind the app changes with the weather.">
<meta property="og:title" content="Live Weather">
<meta property="og:description" content="Weather that looks like the sky outside — forecast, air quality and graphs for any city.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-sky="clear-day">
<div id="skies"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <header class="top">
    <form id="search-box" role="search" autocomplete="off">
      <div class="field">
        <button id="search-button" type="submit" aria-label="Search" data-ico="search"></button>
        <input id="search-bar" type="search" placeholder="Search city" aria-label="Search a city"
               role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list"
               autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search">
        <ul id="sugg" role="listbox" hidden></ul>
      </div>
      <button id="locate" class="ib" type="button" aria-label="Use my location" title="Use my location" data-ico="pin"></button>
      <button id="unit" class="ib" type="button" aria-label="Switch units" title="Switch °C / °F">°C</button>
      <button id="refresh" class="ib" type="button" aria-label="Refresh" title="Refresh" data-ico="refresh"></button>
    </form>
    <div id="recent" aria-label="Recent searches"></div>
  </header>

  <div id="skeleton" aria-hidden="true"><div class="sk"></div><div class="sk s2"></div><div class="sk s2"></div></div>

  <section id="empty" class="card empty" hidden>
    <span id="empty-ico"></span>
    <h2 id="empty-title">Couldn’t load the weather</h2>
    <p id="empty-text"></p>
    <button id="retry" type="button">Try again</button>
  </section>

  <main id="main" hidden>
    <div class="col">
      <section class="hero" id="hero" style="--o:1" aria-live="polite"></section>
      <section class="card" id="tips" style="--o:2" aria-label="Tips"></section>
      <section class="card" id="stats" style="--o:6"></section>
      <section class="card" id="aqi" style="--o:7"></section>
    </div>
    <div class="col">
      <section class="card" id="hourly" style="--o:3"></section>
      <section class="card" id="charts" style="--o:4"></section>
      <section class="card" id="daily" style="--o:5"></section>
    </div>
  </main>

  <footer class="credit">
    <span id="updated"></span>
    <span>Weather data by <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeather</a> · Made by Anubhab Dutta</span>
  </footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
<script src="icons.js"></script>
<script src="weather.js" defer></script>
</body>
</html>
