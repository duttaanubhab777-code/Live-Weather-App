<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a8cff" id="tc">
<title>Live Weather App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="skies"></div>
<canvas id="fx"></canvas>

<div class="app">
  <form id="search-box">
    <input id="search-bar" type="text" placeholder="Search city…" list="sugg" autocomplete="off">
    <datalist id="sugg"></datalist>
    <button id="search-button" type="submit">Search</button>
    <button id="locate" type="button" title="My location">📍</button>
    <button id="unit" type="button" title="Change unit">°C</button>
  </form>
  <div id="recent"></div>

  <div id="skeleton"><div class="sk"></div><div class="sk s2"></div><div class="sk s2"></div></div>

  <main id="main" hidden>
    <div class="col">
      <section class="card hero" id="hero" style="--o:1"></section>
      <section class="card" id="tips" style="--o:2"></section>
      <section class="card" id="stats" style="--o:6"></section>
      <section class="card" id="aqi" style="--o:7"></section>
    </div>
    <div class="col">
      <section class="card" id="hourly" style="--o:3"></section>
      <section class="card" id="charts" style="--o:4"></section>
      <section class="card" id="daily" style="--o:5"></section>
    </div>
  </main>

  <p class="credit">Created by Anubhab Dutta.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="weather.js"></script>
</body>
</html>
